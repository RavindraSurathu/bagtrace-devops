<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BagTrace · Baggage Control</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">BT</span><div><b>BagTrace</b><small>Baggage control · Tier 1 web</small></div></div>
    <div class="health" id="health"><span class="dot"></span><span id="healthText">Checking API…</span></div>
  </header>

  <main>
    <section class="stats" id="stats" aria-label="Bag counts by status"></section>

    <section class="grid">
      <div class="panel wide">
        <div class="panel-head">
          <h2>Bags</h2>
          <form id="filterForm" class="inline">
            <label for="flight" class="sr">Filter by flight</label>
            <input id="flight" placeholder="Flight, e.g. EK525" autocomplete="off">
            <button type="submit">Filter</button>
            <button type="button" id="clearFilter" class="ghost">Clear</button>
          </form>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Tag</th><th>Flight</th><th>Route</th><th>Passenger</th><th>Kg</th><th>Status</th><th></th></tr></thead>
            <tbody id="bags"><tr><td colspan="7" class="empty">Loading bags…</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h2>Send a BSM</h2>
        <p class="hint">Paste a Baggage Source Message as an airline DCS would send it. Add a <code>DEL</code> line after <code>BSM</code> to delete.</p>
        <form id="bsmForm">
          <label for="bsm" class="sr">BSM message</label>
          <textarea id="bsm" rows="9" spellcheck="false">BSM
.V/1LHYD
.F/EK525/18OCT/DXB/Y
.N/0176543300002
.W/K/2/41
.P/1KUMAR/ARJUN
ENDBSM</textarea>
          <button type="submit">Process message</button>
        </form>
        <div id="bsmResult" class="result" role="status"></div>
      </div>

      <div class="panel">
        <h2>Track a bag</h2>
        <form id="trackForm" class="inline">
          <label for="tag" class="sr">Bag tag</label>
          <input id="tag" placeholder="10-digit tag" inputmode="numeric" maxlength="10">
          <button type="submit">Track</button>
        </form>
        <div id="trackResult" class="result" role="status"></div>
      </div>
    </section>
  </main>

  <footer>BagTrace · Nginx (web) → Python API (app) → MySQL (db)</footer>
  <script src="app.js"></script>
</body>
</html>
