name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  lint:
    name: Lint infrastructure code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x -S warning shell/*.sh
      - name: Schema copies match
        run: diff app/db/schema.sql k8s/schema.sql
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Ansible syntax check
        working-directory: ansible
        run: |
          pip install ansible-core
          ansible-galaxy collection install -r requirements.yml
          cp group_vars/all/vault.example.yml group_vars/all/vault.yml
          ansible-playbook site.yml --syntax-check
      - name: Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize k8s/ | ./kubeconform -strict -summary -ignore-missing-schemas

  images:
    name: Build and push images
    needs: [test, lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/ravindrasurathu/bagtrace-${{ matrix.component }}:latest
            ghcr.io/ravindrasurathu/bagtrace-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
