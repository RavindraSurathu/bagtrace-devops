# Deploy everything with:  kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bagtrace
resources:
  - 00-namespace.yaml
  - 10-mysql.yaml
  - 20-backend.yaml
  - 30-frontend.yaml
  - 40-network-policy.yaml
configMapGenerator:
  - name: mysql-schema
    files:
      - schema.sql
generatorOptions:
  disableNameSuffixHash: true
