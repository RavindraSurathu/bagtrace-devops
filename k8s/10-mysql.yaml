# DB tier: MySQL as a StatefulSet with a persistent volume.
# The Secret below holds demo values only; in a real cluster create it with
#   kubectl create secret generic mysql-secret -n bagtrace --from-literal=...
# or use External Secrets / AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: bagtrace
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: RootPass@123
  MYSQL_USER: bagtrace
  MYSQL_PASSWORD: BagTrace@123
  MYSQL_DATABASE: bagtrace
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: bagtrace
  labels: {app: mysql, tier: db}
spec:
  clusterIP: None          # headless: stable DNS for the StatefulSet pod
  selector: {app: mysql}
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: bagtrace
  labels: {app: mysql, tier: db}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql, tier: db}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: mysql-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: schema
          configMap:
            name: mysql-schema   # generated by kustomization.yaml from app/db/schema.sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
