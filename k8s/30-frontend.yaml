# Web tier: Nginx serving the dashboard and proxying /api to the backend Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bagtrace
  labels: {app: frontend, tier: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend, tier: web}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ravindrasurathu/bagtrace-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: BACKEND_HOST
              value: backend.bagtrace.svc.cluster.local
            - name: BACKEND_PORT
              value: "8080"
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /nginx-health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /nginx-health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bagtrace
  labels: {app: frontend, tier: web}
spec:
  selector: {app: frontend}
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Ingress: on EKS this creates an internet-facing ALB through the AWS Load Balancer Controller.
# On minikube/kind, change ingressClassName to "nginx" and remove the alb annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bagtrace
  namespace: bagtrace
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /nginx-health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
